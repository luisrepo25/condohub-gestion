server:
  port: 8081

spring:
  application:
    name: gestion
  datasource:
    url: ${GESTION_DB_URL:jdbc:postgresql://localhost:5432/gestion}
    username: ${GESTION_DB_USER:gestion}
    password: ${GESTION_DB_PASSWORD:gestion_dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none        # el esquema lo manejan las migraciones Flyway
  flyway:
    locations: classpath:db/migration
  graphql:
    schema:
      file-extensions: .graphql,.graphqls
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:condohub}
    password: ${RABBITMQ_PASSWORD:condohub}
    publisher-confirm-type: simple    # S4: el outbox marca un evento publicado solo con la confirmación del broker
    listener:
      simple:
        # Consumidor de la saga (finanzas.reservas): un mensaje a la vez, en orden. Un fallo técnico se reintenta 3
        # veces con espera creciente; si persiste, el mensaje va a la DLQ (condohub.events.dlx), nunca se reencola sin fin.
        concurrency: 1
        prefetch: 1
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s
          multiplier: 2
  security:
    oauth2:
      resourceserver:
        jwt:
          # Las claves se piden al JWKS; el iss del token debe ser exactamente el issuer.
          issuer-uri: ${KEYCLOAK_ISSUER:http://localhost:8180/realms/condohub}
          jwk-set-uri: ${KEYCLOAK_JWKS:http://localhost:8180/realms/condohub/protocol/openid-connect/certs}

condohub:
  outbox:
    exchange: condohub.events
    intervalo-ms: ${OUTBOX_INTERVALO_MS:2000}
    relay:
      habilitado: ${OUTBOX_RELAY_HABILITADO:true}
  saga:
    cola: finanzas.reservas
    consumidor:
      habilitado: ${SAGA_CONSUMIDOR_HABILITADO:true}